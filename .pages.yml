# 博客内容后台：官方 Pages CMS，适配当前 Astro 内容模型。
media:
  - name: uploads
    label: 文章与碎碎念图片
    input: public/uploads
    output: /uploads
    categories:
      - image
    rename: safe
  - name: albums
    label: 摄影图片
    input: public/images/albums
    output: /images/albums
    categories:
      - image
    rename: safe
  - name: profile
    label: 头像与背景
    input: public/assets/touchtat
    output: /assets/touchtat
    categories:
      - image
    rename: safe
content:
  - name: posts
    label: 文章
    type: collection
    path: src/content/文章
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.md'
      field: create
    exclude:
      - images
      - assets
    view:
      primary: title
      fields:
        - title
        - published
        - draft
      sort:
        - published
      default:
        sort: published
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: published
        label: 发布日期
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: updated
        label: 更新日期
        type: date
        options:
          format: yyyy-MM-dd
        default: ''
      - name: draft
        label: 草稿（关闭后公开）
        type: boolean
        default: true
      - name: description
        label: 摘要
        type: text
      - name: image
        label: 封面
        type: image
        options:
          media: uploads
      - name: tags
        label: 标签
        type: string
        list: true
      - name: pinned
        label: 置顶
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          media: uploads
        required: true
  - name: moments
    label: 碎碎念（保存后发布）
    type: collection
    path: src/content/动态
    format: yaml-frontmatter
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.md'
      field: create
    view:
      primary: published
      fields:
        - published
        - location
        - tags
      sort:
        - published
      default:
        sort: published
        order: desc
    fields:
      - name: published
        label: 发布时间
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
      - name: body
        label: 正文
        type: rich-text
        options:
          media: uploads
        required: true
      - name: images
        label: 配图
        type: image
        options:
          media: uploads
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: location
        label: 地点
        type: string
      - name: device
        label: 拍摄设备
        type: string
      - name: pinned
        label: 置顶
        type: boolean
        default: false
  - name: albums
    label: 摄影相册
    type: collection
    path: src/content/相册
    format: json
    filename:
      template: '{year}-{month}-{day}-{hour}{minute}{second}.json'
      field: create
    view:
      primary: title
      fields:
        - title
        - date
        - location
        - draft
      sort:
        - date
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 相册名称
        type: string
        required: true
      - name: subtitle
        label: 相册介绍
        type: text
      - name: date
        label: 拍摄日期
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: location
        label: 拍摄地点
        type: string
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿（关闭后公开）
        type: boolean
        default: true
      - name: cover
        label: 封面
        type: image
        options:
          media: albums
      - name: photos
        label: 照片
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.alt} · {index}'
        fields:
          - name: src
            label: 照片原图
            type: image
            options:
              media: albums
            required: true
          - name: thumbnail
            label: 缩略图（可选）
            type: image
            options:
              media: albums
            description: 没有缩略图时留空，将使用原图。
          - name: alt
            label: 照片说明
            type: string
            description: 用于图片加载失败时显示，也帮助无障碍阅读。
          - name: caption
            label: 图片注释
            type: text
  - name: friends
    label: 友情链接
    type: collection
    path: src/content/友链
    format: yaml-frontmatter
    exclude:
      - 墓碑
    subfolders: false
    filename:
      template: '{primary}.md'
      field: create
    view:
      primary: title
      fields:
        - title
        - siteurl
        - enabled
      sort:
        - added
      default:
        sort: added
        order: desc
    fields:
      - name: title
        label: 朋友的站点名
        type: string
        required: true
      - name: siteurl
        label: 网站地址
        type: string
        required: true
      - name: imgurl
        label: 头像
        type: image
        options:
          media: uploads
        required: true
      - name: desc
        label: 网站介绍
        type: text
        required: true
      - name: added
        label: 添加日期
        type: date
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: enabled
        label: 显示这条友链
        type: boolean
        default: true
      - name: weight
        label: 排序权重
        type: number
        default: 0
      - name: group
        label: 分组
        type: select
        default: friend
        options:
          values:
            - label: 我的朋友
              value: friend
            - label: 更多伙伴
              value: other
  - name: about
    label: 关于我
    type: file
    path: src/content/页面/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: 正文
        type: rich-text
        options:
          media: uploads
        required: true
  - name: friends-intro
    label: 友链页面介绍
    type: file
    path: src/content/页面/friends.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: 正文
        type: rich-text
        options:
          media: uploads
        required: true
settings:
  content:
    merge: true
